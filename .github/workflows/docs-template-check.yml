name: Check docs portal template

on:
  pull_request:
    paths:
      - 'Docs/portal-template/**'
      - '.github/workflows/docs-template-check.yml'
  push:
    paths:
      - 'Docs/portal-template/**'
      - '.github/workflows/docs-template-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Docs/portal-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: Docs/portal-template/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run verify:root
      - run: npm run verify:subpath
