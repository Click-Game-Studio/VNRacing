name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, master, docs/github-pages, docs/versioned-c4-spike]
    paths:
      - 'Docs/portal/**'
      - 'Docs/c4/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: Docs/portal/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Docs/portal

      - name: Build Astro portal
        run: npm run build
        working-directory: Docs/portal

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

