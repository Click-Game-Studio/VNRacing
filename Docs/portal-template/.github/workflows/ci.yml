name: Validate portal

# Gates every pull request and every push to a non-main branch.
# Deployment lives in pages.yml and is not duplicated here; this workflow only
# proves the portal builds and validates for BOTH deployment shapes:
# root base path (`/`) and project subpath (`/example-project`).

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:root
      - run: npm run verify:subpath
